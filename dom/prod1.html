<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container{
            display: flex;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
            gap:30px
        }
        .cards{
            height: 330px;
            width:230px;
            border:solid;
            border-radius:30px;

        }
    </style>
</head>
<body>
    <script>
        let container=document.createElement('section')
        container.classList.add('container')
        for(let i=0;i<20;i++){
            let cards=document.createElement('div')
            cards.classList.add('cards')
            container.body.append(container)
        }
    </script>
    
</body>
</html>
